databases:
  - name: campus-quest-db
    databaseName: campusquest
    user: admin
    plan: free

services:
  - type: redis
    name: campus-quest-redis
    plan: free
    ipAllowList: []

  - type: web
    name: campus-quest-backend
    env: docker
    plan: free
    dockerfilePath: apps/backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-quest-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: campus-quest-redis
          property: connectionString
      - key: PORT
        value: '3001'
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: 'https://my-vercel-client.vercel.app,https://my-vercel-admin.vercel.app' # Replace with actual Vercel URLs
